# Optional Hourly Per-User-Timezone Telegram Reminder Trigger
# Vercel Hobby includes a built-in 1x/day cron in vercel.json.
# To enable exact hourly per-timezone delivery (e.g. 9 AM in each user's local timezone),
# add APP_BASE_URL and CRON_SECRET in GitHub Settings -> Secrets and variables -> Actions.
name: Hourly Telegram Deadline Reminders

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Vercel hourly reminders endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: APP_BASE_URL or CRON_SECRET GitHub secret is not set."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/reminders?mode=hourly"
